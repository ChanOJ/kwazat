# Dependabot (see SECURITY.md). Security updates are always on; these are routine updates,
# grouped and monthly to keep the noise low. Every pull request goes through CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/web"]
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]

  # npm (pnpm): security updates only. Routine version bumps are done by hand, with the evals.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
