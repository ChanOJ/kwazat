# Builds the researcher image (linux/amd64) and pushes it to the Scaleway registry, tagged with
# the commit. Called by the staging deploy on every merge to main; can also be run by hand.
name: Image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Image reference by digest (rg.fr-par.scw.cloud/kwazat/researcher@sha256:...)
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      REGISTRY: rg.fr-par.scw.cloud
      IMAGE: rg.fr-par.scw.cloud/kwazat/researcher
    steps:
      - uses: actions/checkout@v5

      - name: Log in to the Scaleway registry
        env:
          SCW_REGISTRY_SECRET_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
        run: |
          # Retries absorb registry hiccups; a wrong key still fails after the last attempt.
          for attempt in 1 2 3; do
            echo "$SCW_REGISTRY_SECRET_KEY" | docker login "$REGISTRY" -u nologin --password-stdin && exit 0
            echo "Login attempt $attempt failed, retrying in $((attempt * 10)) s" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build and push
        id: push
        run: |
          tag="$IMAGE:sha-${GITHUB_SHA::12}"
          docker buildx build --platform linux/amd64 --provenance=false \
            --tag "$tag" --metadata-file metadata.json --push .
          digest=$(jq -r '."containerimage.digest" // empty' metadata.json)
          [[ "$digest" == sha256:* ]] || { echo "No digest in the build metadata" >&2; exit 1; }
          echo "Pushed $IMAGE@$digest"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Researcher image"
            echo "- Tag: \`$tag\`"
            echo "- Deploy by digest: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
