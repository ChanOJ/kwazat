# Builds the researcher and web images (linux/amd64) and pushes them to the Scaleway registry,
# tagged with the commit. Called by the staging deploy on every merge to main; can also be run
# by hand.
name: Image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Researcher image by digest (rg.fr-par.scw.cloud/kwazat/researcher@sha256:...)
        value: ${{ jobs.build.outputs.image }}
      web_image:
        description: Web image by digest (rg.fr-par.scw.cloud/kwazat/web@sha256:...)
        value: ${{ jobs.build.outputs.web_image }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
      web_image: ${{ steps.push_web.outputs.image }}
    env:
      REGISTRY: rg.fr-par.scw.cloud
      IMAGE: rg.fr-par.scw.cloud/kwazat/researcher
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Scaleway registry
        env:
          SCW_REGISTRY_SECRET_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
        run: |
          # Retries absorb registry hiccups; a wrong key still fails after the last attempt.
          for attempt in 1 2 3; do
            echo "$SCW_REGISTRY_SECRET_KEY" | docker login "$REGISTRY" -u nologin --password-stdin && exit 0
            echo "Login attempt $attempt failed, retrying in $((attempt * 10)) s" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build and push
        id: push
        run: |
          tag="$IMAGE:sha-${GITHUB_SHA::12}"
          docker buildx build --platform linux/amd64 --provenance=false \
            --tag "$tag" --metadata-file metadata.json --push .
          digest=$(jq -r '."containerimage.digest" // empty' metadata.json)
          [[ "$digest" == sha256:* ]] || { echo "No digest in the build metadata" >&2; exit 1; }
          echo "Pushed $IMAGE@$digest"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Researcher image"
            echo "- Tag: \`$tag\`"
            echo "- Deploy by digest: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push web
        id: push_web
        env:
          WEB: rg.fr-par.scw.cloud/kwazat/web
        run: |
          tag="$WEB:sha-${GITHUB_SHA::12}"
          docker buildx build --platform linux/amd64 --provenance=false \
            --tag "$tag" --metadata-file web-metadata.json --push web
          digest=$(jq -r '."containerimage.digest" // empty' web-metadata.json)
          [[ "$digest" == sha256:* ]] || { echo "No digest in the web build metadata" >&2; exit 1; }
          echo "Pushed $WEB@$digest"
          echo "image=$WEB@$digest" >> "$GITHUB_OUTPUT"
          echo "- Web: \`$WEB@$digest\`" >> "$GITHUB_STEP_SUMMARY"
