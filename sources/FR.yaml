  - { domain: cours-appel.justice.fr, name: Courts of appeal and prosecutors (incl. PNF), types: [ court ], signals: [ { id: official } ] }
  - { domain: tribunal-de-paris.justice.fr, name: Tribunal judiciaire de Paris, types: [ court ], signals: [ { id: official } ] }

  # Parliament, government, public ethics
  - { domain: assemblee-nationale.fr, name: Assemblée nationale, types: [ parliament ], signals: [ { id: official } ] }
  - { domain: senat.fr, name: Sénat, types: [ parliament ], signals: [ { id: official } ] }
  - { domain: hatvp.fr, name: HATVP (public officials' declarations), types: [ regulator, registry ], signals: [ { id: official } ] }
