  - { domain: interieur.gouv.fr, name: Ministry of the Interior (election results), types: [ government ], signals: [ { id: official } ] }
  - { domain: vie-publique.fr, name: Vie publique, types: [ government ], signals: [ { id: official } ] }
  - { domain: arcom.fr, name: Arcom (media regulator), types: [ regulator ], signals: [ { id: official } ] }

  # Companies, markets and products (brand and product playbooks)
  - { domain: annuaire-entreprises.data.gouv.fr, name: Annuaire des entreprises, types: [ registry ], signals: [ { id: official } ] }
  - { domain: bodacc.fr, name: BODACC, types: [ registry ], signals: [ { id: official } ] }
  - { domain: amf-france.org, name: AMF (financial markets), types: [ regulator ], signals: [ { id: official } ] }
  - { domain: autoritedelaconcurrence.fr, name: Autorité de la concurrence, types: [ regulator ], signals: [ { id: official } ] }
